<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Fighter - CPU Edition</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#111;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    background:linear-gradient(to bottom,#87ceeb 0%,#b8e6ff 60%,#c9a16b 60%,#c9a16b 100%);
    overflow:hidden;
}

#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#444;
}

.fighter{
    position:absolute;
    width:70px;
    height:120px;
    bottom:120px;
    border-radius:10px;
    transition:transform .08s;
}

#player{
    background:#3498db;
}

#cpu{
    background:#e74c3c;
}

.healthBox{
    position:absolute;
    top:20px;
    width:320px;
    height:32px;
    background:#444;
    border:3px solid white;
}

#playerHealthBox{
    left:20px;
}

#cpuHealthBox{
    right:20px;
}

.health{
    width:100%;
    height:100%;
    background:lime;
}

#scoreboard{
    position:absolute;
    top:70px;
    width:100%;
    text-align:center;
    color:white;
    font-size:30px;
    font-weight:bold;
}

#announcement{
    position:absolute;
    top:40%;
    width:100%;
    text-align:center;
    color:white;
    font-size:90px;
    font-weight:bold;
    text-shadow:4px 4px 12px black;
    display:none;
    z-index:100;
}

#winner{
    position:absolute;
    top:50%;
    width:100%;
    text-align:center;
    color:white;
    font-size:60px;
    font-weight:bold;
    text-shadow:4px 4px 12px black;
    display:none;
}

#controls{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    color:white;
    font-size:18px;
}

#startMessage{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:40px;
    text-shadow:3px 3px 10px black;
    z-index:999;
}
</style>
</head>
<body>

<div id="game">

    <div id="playerHealthBox" class="healthBox">
        <div id="playerHealth" class="health"></div>
    </div>

    <div id="cpuHealthBox" class="healthBox">
        <div id="cpuHealth" class="health"></div>
    </div>

    <div id="scoreboard">
        YOU: <span id="playerScore">0</span>
        |
        ROUND <span id="roundNum">1</span>
        |
        CPU: <span id="cpuScore">0</span>
    </div>

    <div id="player" class="fighter"></div>
    <div id="cpu" class="fighter"></div>

    <div id="announcement"></div>
    <div id="winner"></div>

    <div id="ground"></div>

    <div id="startMessage">
        CLICK TO START MUSIC
    </div>

    <div id="controls">
        Move: A D | Jump: W | Attack: F | Restart: R
    </div>

</div>

<script>
// ======================
// AUDIO
// ======================

const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

function beep(freq,duration,type="square",vol=.05){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.value = vol;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function hitSound(){
    beep(150,.08,"square",.08);
}

function jumpSound(){
    beep(450,.08,"triangle",.05);
}

function roundSound(){
    beep(523,.15,"triangle",.08);
    setTimeout(()=>beep(659,.15,"triangle",.08),150);
}

function koSound(){
    beep(150,.2,"sawtooth",.08);
    setTimeout(()=>beep(90,.4,"sawtooth",.08),150);
}

let musicStarted=false;

function startMusic(){

    if(musicStarted) return;

    musicStarted=true;
    document.getElementById("startMessage").style.display="none";

    const melody=[
        262,330,392,330,
        294,349,440,349,
        262,330,392,330,
        220,262,330,392
    ];

    let i=0;

    setInterval(()=>{
        beep(melody[i],0.18,"triangle",0.03);
        i=(i+1)%melody.length;
    },250);
}

document.body.addEventListener("click",async()=>{
    await audioCtx.resume();
    startMusic();
},{once:true});

// ======================
// GAME VARIABLES
// ======================

const player=document.getElementById("player");
const cpu=document.getElementById("cpu");

const playerHealthBar=document.getElementById("playerHealth");
const cpuHealthBar=document.getElementById("cpuHealth");

const announcement=document.getElementById("announcement");
const winner=document.getElementById("winner");

const playerScoreEl=document.getElementById("playerScore");
const cpuScoreEl=document.getElementById("cpuScore");
const roundNumEl=document.getElementById("roundNum");

let keys={};

let round=1;
let playerScore=0;
let cpuScore=0;

let roundActive=false;
let matchOver=false;

const gravity=.8;

let p;
let c;

function resetFighters(){

    p={
        x:200,
        y:0,
        vy:0,
        health:100
    };

    c={
        x:900,
        y:0,
        vy:0,
        health:100
    };

    updateHealth();
}

function updateHealth(){
    playerHealthBar.style.width=Math.max(0,p.health)+"%";
    cpuHealthBar.style.width=Math.max(0,c.health)+"%";
}

function showText(text,time=1800){

    announcement.innerHTML=text;
    announcement.style.display="block";

    setTimeout(()=>{
        announcement.style.display="none";
    },time);
}

function startRound(){

    resetFighters();

    roundActive=false;

    showText("ROUND "+round);

    roundSound();

    setTimeout(()=>{

        showText("FIGHT!",1000);

        roundActive=true;

    },1800);
}

function endRound(winnerPlayer){

    if(matchOver) return;

    roundActive=false;

    announcement.innerHTML="KO!";
    announcement.style.display="block";

    koSound();

    if(winnerPlayer==="player"){
        playerScore++;
    }else{
        cpuScore++;
    }

    playerScoreEl.textContent=playerScore;
    cpuScoreEl.textContent=cpuScore;

    if(playerScore>=2 || cpuScore>=2){

        matchOver=true;

        setTimeout(()=>{

            announcement.style.display="none";

            winner.innerHTML=
                playerScore>cpuScore
                ? "YOU WIN!"
                : "CPU WINS!";

            winner.style.display="block";

        },2000);

        return;
    }

    setTimeout(()=>{

        round++;
        roundNumEl.textContent=round;

        announcement.style.display="none";

        startRound();

    },2500);
}

// ======================
// ATTACKS
// ======================

function playerAttack(){

    if(!roundActive) return;

    player.style.transform="scaleX(1.2)";

    setTimeout(()=>{
        player.style.transform="scaleX(1)";
    },80);

    if(Math.abs(p.x-c.x)<100){

        hitSound();

        c.health-=10;
        c.x+=35;

        updateHealth();

        if(c.health<=0){
            endRound("player");
        }
    }
}

let cpuAttackCooldown=0;

function cpuAttack(){

    if(cpuAttackCooldown>0) return;

    cpuAttackCooldown=45;

    cpu.style.transform="scaleX(1.2)";

    setTimeout(()=>{
        cpu.style.transform="scaleX(1)";
    },80);

    if(Math.abs(p.x-c.x)<100){

        hitSound();

        p.health-=10;
        p.x-=35;

        updateHealth();

        if(p.health<=0){
            endRound("cpu");
        }
    }
}

// ======================
// INPUT
// ======================

document.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key.toLowerCase()==="f"){
        playerAttack();
    }

    if(e.key.toLowerCase()==="r"){
        location.reload();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

// ======================
// CPU AI
// ======================

function updateCPU(){

    if(!roundActive) return;

    const distance = p.x - c.x;

    if(Math.abs(distance)>85){

        if(distance>0){
            c.x+=2.8;
        }else{
            c.x-=2.8;
        }

    }else{

        if(Math.random()<0.04){
            cpuAttack();
        }
    }

    if(Math.random()<0.003 && c.y===0){
        c.vy=15;
    }

    if(cpuAttackCooldown>0){
        cpuAttackCooldown--;
    }
}

// ======================
// GAME LOOP
// ======================

function update(){

    if(roundActive){

        if(keys["a"]) p.x-=6;
        if(keys["d"]) p.x+=6;

        if(keys["w"] && p.y===0){
            p.vy=15;
            jumpSound();
        }

        updateCPU();

        p.vy-=gravity;
        p.y+=p.vy;

        if(p.y<0){
            p.y=0;
            p.vy=0;
        }

        c.vy-=gravity;
        c.y+=c.vy;

        if(c.y<0){
            c.y=0;
            c.vy=0;
        }

        p.x=Math.max(0,Math.min(window.innerWidth-70,p.x));
        c.x=Math.max(0,Math.min(window.innerWidth-70,c.x));
    }

    player.style.left=p.x+"px";
    player.style.bottom=(120+p.y)+"px";

    cpu.style.left=c.x+"px";
    cpu.style.bottom=(120+c.y)+"px";

    requestAnimationFrame(update);
}

// ======================
// START
// ======================

resetFighters();
startRound();
update();

</script>

</body>
</html>
